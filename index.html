  <!-- Boot-time error capture. MUST be the first script: records data files / CDN scripts that fail to load or throw. -->
  <script>
    (function () {
      window.__ECG_ERRORS = [];      // data/*.js problems (shown in the app)
      window.__ECG_UI_ERRORS = [];   // CDN / UI problems (shown by the boot fallback)
      window.__ECG_DATA_DONE = false;
      window.__ECG_BOOTED = false;
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && t.tagName === 'SCRIPT') {
          var src = t.getAttribute('src') || '(inline)';
          var rec = { file: src, kind: 'load', message: '檔案無法載入（不存在或網路錯誤）' };
          // relative scripts = content data files; absolute http(s) = CDN libraries
          if (!/^(https?:)?\/\//i.test(src)) window.__ECG_ERRORS.push(rec); else window.__ECG_UI_ERRORS.push(rec);
          return;
        }
        if (t && t !== window && t.tagName) return; // images etc. are handled by their components
        if (window.__ECG_BOOTED) return;
        var cs = document.currentScript;
        var file = (cs && cs.getAttribute && cs.getAttribute('src')) || '';
        if (!file) {
          var m = String(e.filename || '').match(/(data\/[^\/?#]+\.js)/);
          file = m ? m[1] : (!window.__ECG_DATA_DONE && window.__ECG_CUR) || '';
        }
        var msg = e.message || String(e.error);
        // file:// pages get muted "Script error." without details
        if (/^Script error\.?$/i.test(msg)) msg = '執行錯誤（語法或執行期錯誤）；請執行 node validate.js 查看詳細訊息';
        var rec2 = { file: file || '(inline)', kind: 'runtime', message: msg, line: e.lineno || null };
        if (!window.__ECG_DATA_DONE) window.__ECG_ERRORS.push(rec2); else window.__ECG_UI_ERRORS.push(rec2);
      }, true);
    })();
  </script>

  <script>window.__ECG_DATA_DONE = true; window.__ECG_CUR = null;</script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* =====================================================================
     * 1. DATA ACCESS (all content comes from window.ECG, see SPEC §2)
     * ===================================================================== */
    const ECG = window.ECG || null;
    const DATA_OK = !!ECG;
    const META = (ECG && ECG.META) || {};
    const TREE = (ECG && ECG.TREE) || {};
    const FOOTNOTES = (ECG && ECG.FOOTNOTES) || {};
    const REF_DATA = (ECG && ECG.REF_DATA) || {};
    const TAG_LEVELS = (ECG && ECG.TAG_LEVELS) || {};
    const STAGE_TABLE = (ECG && ECG.STAGE_TABLE) || null;
    const CFG = Object.assign({ pageBases: ['_source_pages/'] }, window.ECG_CONFIG || {});
    // META.sourcePages = number of source-page images in _source_pages/ (p01.png …). 0 / missing = this app
    // ships no source viewer: every 原始頁面 button, the home 原始指引 tile and page numbers are hidden and
    // openPages() is a no-op (node/panel `source` fields may still exist for maintainers, see SPEC §2).
    const TOTAL_PAGES = Math.max(0, Math.floor(Number(META.sourcePages) || 0));
    const HAS_PAGES = TOTAL_PAGES > 0;
    const LOAD_ERRORS = (window.__ECG_ERRORS || []).slice();

    const GROUPS = [
      { key: 'dx', label: '診斷與分期', en: 'Diagnosis & staging' },
      { key: 'tx', label: '治療原則', en: 'Treatment' },
      { key: 'misc', label: '其他', en: 'Others' }
    ];
    const groupLabel = (k) => (GROUPS.find(g => g.key === k) || GROUPS[2]).label;

    // Panels: REF_PANELS order, de-duplicated; REF_DATA keys missing from REF_PANELS are appended under "misc".
    const PANELS = (() => {
      const seen = new Set(); const out = [];
      const listed = (ECG && Array.isArray(ECG.REF_PANELS)) ? ECG.REF_PANELS : [];
      listed.forEach(p => {
        if (!p || !p.key || seen.has(p.key)) return;
        seen.add(p.key);
        out.push({ key: p.key, label: p.label || (REF_DATA[p.key] && REF_DATA[p.key].title) || p.key,
          group: GROUPS.some(g => g.key === p.group) ? p.group : 'misc', available: !!REF_DATA[p.key] });
      });
      Object.keys(REF_DATA).forEach(k => {
        if (seen.has(k)) return; seen.add(k);
        out.push({ key: k, label: (REF_DATA[k] && REF_DATA[k].title) || k, group: 'misc', available: true });
      });
      return out;
    })();
    const PANEL_BY_KEY = {}; PANELS.forEach(p => { PANEL_BY_KEY[p.key] = p; });

    const linksOf = (n) => [].concat((n && n.options) || [], (n && n.nextSteps) || []).filter(o => o && o.next);

    // Incoming edges (for breadcrumb / search titles) and BFS parents from root (for "full path" links).
    const INCOMING = {};
    Object.keys(TREE).forEach(id => {
      linksOf(TREE[id]).forEach(o => { (INCOMING[o.next] = INCOMING[o.next] || []).push({ from: id, label: o.label || '' }); });
    });
    const PARENT = (() => {
      const par = {};
      if (!TREE.root) return par;
      par.root = null;
      const q = ['root'];
      while (q.length) {
        const id = q.shift();
        linksOf(TREE[id]).forEach(o => { if (TREE[o.next] && !(o.next in par)) { par[o.next] = id; q.push(o.next); } });
      }
      return par;
    })();
    function pathFromRoot(id) {
      if (!(id in PARENT)) return null;
      const out = []; let c = id;
      while (c) { out.unshift(c); c = PARENT[c]; }
      return out;
    }
    function nodeTitle(id) { const n = TREE[id]; return n ? (n.question || n.title || id) : id; }
    function incomingFirst(id) { const a = INCOMING[id]; return a && a.length ? a[0].label : ''; }
    function defaultLabel(id) { return id === 'root' ? '開始' : (incomingFirst(id) || nodeTitle(id)); }
    function labelFor(prevId, id) {
      const o = linksOf(TREE[prevId]).find(x => x.next === id);
      return (o && o.label) || defaultLabel(id);
    }

    // In-browser integrity summary (full checks live in validate.js)
    const INTEGRITY = (() => {
      const broken = [], notes = [], panels = [];
      Object.keys(TREE).forEach(id => {
        const n = TREE[id]; if (!n || typeof n !== 'object') return;
        linksOf(n).forEach(o => { if (!TREE[o.next]) broken.push(id + ' → ' + o.next); });
        (n.notes || []).forEach(k => { if (!(k in FOOTNOTES)) notes.push(id + ' → ' + k); });
        (n.refs || []).forEach(r => { if (r && r.panel && !REF_DATA[r.panel]) panels.push(id + ' → ' + r.panel); });
      });
      return { broken, notes, panels, total: broken.length + notes.length + panels.length };
    })();

    // Tag levels actually used by the loaded content (tree tags + "tag-<level>" classes in panel HTML).
    // The home legend lists only these (the slides carry no NHI/TFDA info); falls back to all TAG_LEVELS.
    const USED_TAG_LEVELS = (() => {
      const used = new Set();
      Object.keys(TREE).forEach(id => { const n = TREE[id]; ((n && n.tags) || []).forEach(t => { if (t && t.level) used.add(t.level); }); });
      Object.keys(REF_DATA).forEach(k => {
        const c = REF_DATA[k] && REF_DATA[k].content;
        if (typeof c === 'string') (c.match(/\btag-[a-z_]+/g) || []).forEach(m => used.add(m.slice(4)));
      });
      const ks = Object.keys(TAG_LEVELS).filter(k => used.has(k));
      return ks.length ? ks : Object.keys(TAG_LEVELS);
    })();
    // wording in the source guideline for the levels that map 1:1 (home legend footnote; only levels in use are listed)
    const TAG_SOURCE_TERMS = { preferred: 'Preferred / prefer regimen', other: 'Other recommended', certain: 'Useful in certain circumstances' };

    /* =====================================================================
     * 2. HELPERS
     * ===================================================================== */
    const enc = encodeURIComponent;
    const pad2 = (n) => String(n).padStart(2, '0');
    const norm = (s) => String(s == null ? '' : s).normalize('NFKC').replace(/\s+/g, ' ').trim();
    const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const truncate = (s, n) => (s && s.length > n ? s.slice(0, n) + '…' : s);
    const splitTerms = (q) => Array.from(new Set(norm(q).toLowerCase().split(' ').filter(Boolean)));

    function normPages(src) {
      const arr = Array.isArray(src) ? src : (src != null ? [src] : []);
      return Array.from(new Set(arr.map(Number).filter(n => Number.isFinite(n) && n >= 1))).sort((a, b) => a - b);

    function compressPages(pages) {
      const out = []; let s = null, p = null;
      pages.forEach(n => {
        if (s === null) { s = p = n; } else if (n === p + 1) { p = n; }
        else { out.push(s === p ? String(s) : s + '–' + p); s = p = n; }

      if (s !== null) out.push(s === p ? String(s) : s + '–' + p);
      return out.join(', ');
    }
    const pageSrc = (n, baseIdx) => (CFG.pageBases[baseIdx || 0] || '_source_pages/') + 'p' + pad2(n) + '.png';

    // ---- hash routing: #/  #/path/root/a/b  #/node/x[?from=stage]  #/ref/KEY[/anchor]  #/stage[/<scheme>/<v1>/<v2>/…]
    //      (legacy single-scheme STAGE_TABLE: #/stage[/T/N/M]); no page-viewer route — source pages open in a modal (META.sourcePages > 0 only)
    function parseHash(raw) {
      let h = String(raw || '').replace(/^#/, '');
      const query = {};
      const qi = h.indexOf('?');
      if (qi >= 0) {
        h.slice(qi + 1).split('&').forEach(kv => { const i = kv.indexOf('='); if (i > 0) query[kv.slice(0, i)] = safeDecode(kv.slice(i + 1)); });
        h = h.slice(0, qi);
      }
      const parts = h.split('/').filter(Boolean).map(safeDecode);
      if (!parts.length) return { kind: 'home' };
      const head = parts[0], rest = parts.slice(1);
      if (head === 'path') return { kind: 'tree', mode: 'path', ids: rest.length ? rest : ['root'] };
      if (head === 'node') return rest.length ? { kind: 'tree', mode: 'node', ids: rest, from: query.from || 'search' } : { kind: 'home' };
      if (head === 'ref') return { kind: 'ref', panel: rest[0] || null, anchor: rest[1] || null };
      if (head === 'stage') return { kind: 'stage', preset: rest };
      return { kind: 'home', unknown: h };
    }
    function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
    function treeHash(mode, ids, from) {
      return '#/' + mode + '/' + ids.map(enc).join('/') + (mode === 'node' && from && from !== 'search' ? '?from=' + enc(from) : '');
    }
    function refHash(panel, anchor) { return '#/ref' + (panel ? '/' + enc(panel) + (anchor ? '/' + enc(anchor) : '') : ''); }

    // ---- reference panel HTML helpers
    const HEAD_SEL = 'h4, summary';
    function prepareRefHtml(html) {
      return String(html || '')
        .replace(/<table\b/gi, '<div class="ref-table-wrap"><table')
        .replace(/<\/table\s*>/gi, '</table></div>');
    }
    function anchorFromId(key, id) { return id && id.indexOf(key + '-') === 0 ? id.slice(key.length + 1) : id; }
    // true when REF_DATA[panel].content has id="PANEL-anchor" (or id="anchor")
    function panelHasAnchor(panel, anchor) {
      const c = REF_DATA[panel] && REF_DATA[panel].content;
      if (typeof c !== 'string' || !anchor) return false;
      const re = new RegExp('\\sid\\s*=\\s*["\'](' + escRe(panel + '-' + anchor) + '|' + escRe(String(anchor)) + ')["\']', 'i');
      return re.test(c);
    }
    function findAnchorEl(root, key, anchor) {
      if (!root || !anchor) return null;
      const cands = [key + '-' + anchor, anchor];
      for (let i = 0; i < cands.length; i++) {
        const el = root.querySelector('[id="' + cands[i].replace(/["\\]/g, '\\$&') + '"]');
        if (el) return el;
      }
      return null;
    }
    function revealEl(el) {
      let d = el.tagName === 'SUMMARY' ? el.parentElement : el.closest('details');
      while (d) {
        if (d.tagName === 'DETAILS') d.open = true;
        d = d.parentElement ? d.parentElement.closest('details') : null;
      }
    }
    function scrollToEl(el, container, smooth) {
      if (!el || !container) return;
      const top = Math.max(0, el.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop - 12);
      // instant jump for long distances / initial open; smooth only for short in-panel moves
      container.scrollTo({ top, behavior: smooth && Math.abs(top - container.scrollTop) < 1500 ? 'smooth' : 'auto' });

    }
    function highlightDom(root, terms) {
      if (!root || !terms.length) return 0;

      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      const nodes = []; let n;
      while ((n = walker.nextNode())) {
        if (n.nodeValue.trim() && !(n.parentElement && n.parentElement.closest('mark,script,style'))) nodes.push(n);
      }
      let count = 0;
      nodes.forEach(node => {
        const text = node.nodeValue; re.lastIndex = 0;
        if (!re.test(text)) return;
        re.lastIndex = 0;
        const frag = document.createDocumentFragment(); let last = 0; let m;
        while ((m = re.exec(text))) {
          if (!m[0].length) { re.lastIndex++; continue; }
          if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
          const mk = document.createElement('mark'); mk.className = 'hl'; mk.textContent = m[0];
          frag.appendChild(mk); last = m.index + m[0].length; count++;
        }
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        node.parentNode.replaceChild(frag, node);
      });
      return count;
    }

    function copyText(text) {
      return new Promise((resolve) => {
        const fallback = () => {
          try {
            const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
            ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();

    /* =====================================================================
     * 3. FULL-TEXT SEARCH (index built lazily on first open)
     * ===================================================================== */
    let SEARCH_CACHE = null;
    function getSearchIndex() {
      if (!SEARCH_CACHE) {
        try { SEARCH_CACHE = buildSearchIndex(); } catch (e) { console.warn('[ECG] search index failed', e); SEARCH_CACHE = []; }
      }
      return SEARCH_CACHE;
    }
    // add spaces at block boundaries so "<td>A</td><td>B</td>" doesn't index as "AB"
    const spaceBlocks = (html) => html.replace(/<br\s*\/?>/gi, ' <br>').replace(/<\/(td|th|li|p|div|tr|h[1-6]|summary|dt|dd|caption|table)\s*>/gi, '$& ');

    function buildSearchIndex() {
      const out = [];
      const noteUsers = {};
      Object.keys(TREE).forEach(id => {
        const n = TREE[id]; if (!n || typeof n !== 'object') return;
        (n.notes || []).forEach(k => { (noteUsers[k] = noteUsers[k] || []).push(id); });
        const parts = [];
        if (n.question) parts.push(n.question);
        if (n.content) parts.push(n.content);
        if (n.extra) parts.push(n.extra);
        (n.options || []).forEach(o => { if (o) { parts.push(o.label || ''); if (o.sub) parts.push(o.sub); } });
        (n.tags || []).forEach(t => { if (t) parts.push((t.text || '') + ' ' + (TAG_LEVELS[t.level] || '')); });
        const isRes = !!n.isResult;
        const title = isRes ? (incomingFirst(id) || n.title || id) : (n.question || id);
        out.push({ kind: isRes ? 'result' : 'question', id, title: norm(title), sub: isRes ? norm(n.title || '') : '', text: norm(parts.join(' · ')) });
      });
      Object.keys(FOOTNOTES).forEach(k => {
        out.push({ kind: 'note', id: k, title: '註腳', sub: '', text: norm(FOOTNOTES[k]), users: noteUsers[k] || [] });
      });
      if (typeof DOMParser !== 'undefined') {
        const parser = new DOMParser();
        PANELS.forEach(p => {
          const d = REF_DATA[p.key]; if (!d || !d.content) return;
          try {
            const doc = parser.parseFromString('<div id="lcg-idx-root">' + spaceBlocks(prepareRefHtml(d.content)) + '</div>', 'text/html');
            const rootEl = doc.getElementById('lcg-idx-root'); if (!rootEl) return;
            const heads = Array.from(rootEl.querySelectorAll(HEAD_SEL));
            const headIdx = new Map(heads.map((h, i) => [h, i]));
            const panelTitle = d.title || p.label;
            const sections = [{ title: panelTitle, headingIndex: -1, anchor: null, text: '' }];
            let cur = sections[0], curHead = null, node;
            const walker = doc.createTreeWalker(rootEl, 5 /* SHOW_ELEMENT | SHOW_TEXT */, null);
            while ((node = walker.nextNode())) {

                let t = norm(node.textContent);
                if (node.tagName === 'H4') {

                cur = { title: t || panelTitle, headingIndex: headIdx.get(node), anchor: rawId ? anchorFromId(p.key, rawId) : null, text: '' };
                sections.push(cur); curHead = node;

              out.push({ kind: 'ref', panel: p.key, panelLabel: p.label, panelTitle, title: s.title, anchor: s.anchor, headingIndex: s.headingIndex, text });
            });
          } catch (e) { console.warn('[ECG] cannot index panel', p.key, e); }
        });
      }
      out.forEach(e => {
        e._t = e.title.toLowerCase(); e._x = e.text.toLowerCase();
        e._p = (e.kind === 'ref' ? [e.panelLabel, e.panelTitle, e.panel].join(' ') : (e.sub || '')).toLowerCase();
      });
      return out;
    }
    function countOcc(hay, needle, cap) {
      let c = 0, i = 0;
      while (c < cap && (i = hay.indexOf(needle, i)) !== -1) { c++; i += needle.length || 1; }
      return c;
    }
    function runSearch(index, terms) {
      if (!terms.length) return [];
      const res = [];
      for (let k = 0; k < index.length; k++) {
        const e = index[k]; let score = 0, ok = true;
        for (let j = 0; j < terms.length; j++) {
          const t = terms[j];
          const inT = e._t.indexOf(t) !== -1, c = countOcc(e._x, t, 5), inP = e._p.indexOf(t) !== -1;
          if (!inT && !c && !inP) { ok = false; break; }

    // allow line breaks after "/" in long regimen names without inserting characters

      return out;

    function RichText({ text, className }) {

      }
    }

    /* =====================================================================
     * 6. HEADER / BREADCRUMB / FOOTER
     * ===================================================================== */
    function HeaderBtn({ onClick, title, icon, label, kbd }) {
      return (
        <button onClick={onClick} title={title} aria-label={title}
          className="flex items-center justify-center gap-1.5 h-10 min-w-[40px] px-2 sm:px-2.5 rounded-lg hover:bg-white/10 active:bg-white/20 transition-colors flex-shrink-0">
          {icon}<span className="hidden sm:inline text-sm font-medium">{label}</span>
          {kbd ? <kbd className="k hidden md:inline">{kbd}</kbd> : null}
        </button>
      );
    }
    function Header({ onHome, onSearch, onStage, onRefs }) {
      return (
        <header className="glass-header text-white sticky top-0 z-30 shadow-md safe-top">
          <div className="max-w-4xl mx-auto px-4 h-14 flex items-center gap-1">
            <button onClick={onHome} className="flex items-center gap-2.5 min-w-0 flex-1 text-left group mr-1" aria-label="回首頁">
              <span className="bg-brand-700 group-hover:bg-accent-600 transition-colors p-1.5 rounded-lg flex-shrink-0"><IconEsophagus size={22} /></span>
              <span className="min-w-0">
                <span className="block font-bold text-[15px] sm:text-lg leading-tight truncate">{META.title || '食道癌多專科診療指引'}</span>
                <span className="block text-[11px] sm:text-xs text-brand-100/90 truncate">{META.version || ''}</span>
              </span>
            </button>
            <HeaderBtn onClick={onSearch} title="全文搜尋（快捷鍵 /）" icon={<IconSearch />} label="搜尋" kbd="/" />
            <HeaderBtn onClick={onStage} title={(STAGE_EDITION ? STAGE_EDITION + ' ' : '') + '分期計算器'} icon={<IconCalc />} label="分期" />
            <HeaderBtn onClick={onRefs} title="參考資料" icon={<IconBook />} label="參考" />
          </div>
        </header>
      );
    }

    function Breadcrumb({ crumbs }) {
      const ref = useRef(null);
      useEffect(() => { if (ref.current) ref.current.scrollLeft = ref.current.scrollWidth; }, [crumbs.length]);
      if (crumbs.length <= 1) return null;
      return (
        <nav aria-label="決策路徑" className="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-14 z-20 no-print">
          <div ref={ref} className="max-w-2xl mx-auto px-4 py-2 flex items-center gap-1 overflow-x-auto breadcrumb-scroll">
            {crumbs.map((c, i) => (
              <React.Fragment key={i}>
                {i > 0 && <span className="text-slate-300 flex-shrink-0"><IconChevronRight /></span>}
                <button onClick={c.onClick} title={c.label}
                  className={'text-xs px-2 py-1.5 rounded-md flex-shrink-0 transition-colors inline-flex items-center gap-1 ' +
                    (c.current ? 'bg-brand-700 text-white font-bold' :
                      c.special ? 'bg-sky-50 text-accent-600 font-semibold hover:bg-sky-100' :
                        c.missing ? 'text-red-600 hover:bg-red-50' : 'text-slate-500 hover:text-brand-700 hover:bg-brand-50')}>
                  {c.icon || null}{truncate(c.label, 22)}
                </button>
              </React.Fragment>
            ))}
          </div>
        </nav>
      );
    }

    function Footer() {
      const build = window.__ECG_BUILD;
      return (
        <footer className="w-full max-w-3xl mx-auto px-4 pt-4 pb-28 text-center text-xs text-slate-500 leading-relaxed space-y-1.5">
          <p>※ {FOOTNOTES.note_disclaimer || '本指引之用藥建議基於現有臨床證據，與衛福部或健保署規定無關。'}</p>
          <p>※ {FOOTNOTES.note_mdt || '病情複雜請交由多專科團隊討論。'}</p>
          {META.basis && <p className="text-slate-500">{META.basis}</p>}
          <p className="text-slate-400 pt-1">
            {[META.team, META.version].filter(Boolean).join(' · ')}
            {META.sourcePdf ? <> · 來源：{META.sourceUrl ? <a href={META.sourceUrl} target="_blank" rel="noopener" className="underline hover:text-brand-700">{META.sourcePdf}</a> : META.sourcePdf}</> : null}
            {build && build.built ? ' · 單檔版建置 ' + build.built : ''}
          </p>
        </footer>
      );
    }

    function DataErrorBanner({ errors, onDismiss }) {
      if (!errors.length) return null;
      return (
        <div role="alert" className="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-800 animate-fade-in">
          <div className="flex items-start gap-2.5">
            <span className="flex-shrink-0 mt-0.5"><IconAlert /></span>
            <div className="flex-1 min-w-0">
              <p className="font-bold">資料檔載入失敗，內容可能不完整</p>
              <ul className="mt-1.5 space-y-0.5 list-disc pl-5 break-words">
                {errors.map((e, i) => (
                  <li key={i}><code className="font-semibold">{e.file}</code>：{e.message}{e.line ? '（第 ' + e.line + ' 行）' : ''}</li>
                ))}
              </ul>
              <p className="mt-2 text-xs text-red-700/80">請確認 <code>data/</code> 資料夾與 index.html 位於同一目錄，並執行 <code>node validate.js</code> 檢查資料。</p>
            </div>
            <button onClick={onDismiss} className="flex-shrink-0 p-1 rounded hover:bg-red-100" aria-label="關閉提示"><IconX size={18} /></button>
          </div>
        </div>
      );
    }

    /* =====================================================================
     * 7. DECISION TREE VIEWS
     * ===================================================================== */
    const TONES = {
      primary: { card: 'bg-blue-50 border-blue-200 text-blue-950', icon: 'bg-blue-100 text-blue-600' },
      warning: { card: 'bg-amber-50 border-amber-200 text-amber-950', icon: 'bg-amber-100 text-amber-600' },
      danger: { card: 'bg-red-50 border-red-200 text-red-950', icon: 'bg-red-100 text-red-600' },
      neutral: { card: 'bg-slate-50 border-slate-200 text-slate-900', icon: 'bg-slate-200 text-slate-600' }
    };

    function RefLinks({ refs, openRef }) {
      if (!Array.isArray(refs) || !refs.length) return null;
      return (
        <div className="mt-6">
          <h3 className="flex items-center gap-2 text-sm font-bold text-slate-600 mb-2.5"><IconBook size={16} /> 相關參考資料</h3>
          <div className="flex flex-col sm:flex-row sm:flex-wrap gap-2">
            {refs.map((r, i) => {
              if (!r) return null;
              const ok = !!REF_DATA[r.panel];
              const p = PANEL_BY_KEY[r.panel];
              const panelName = p ? p.label : r.panel;
              return (
                <button key={i} disabled={!ok} onClick={() => openRef(r.panel, r.anchor || null)}
                  className={'inline-flex items-center gap-2 text-left px-3.5 py-2 rounded-xl border text-sm font-medium transition min-h-[44px] ' +
                    (ok ? 'border-emerald-200 bg-emerald-50 text-emerald-900 hover:bg-emerald-100 hover:border-emerald-400' : 'border-red-200 bg-red-50 text-red-700 cursor-not-allowed')}>
                  <span className="flex-shrink-0 opacity-70"><IconBook size={16} /></span>
                  <span className="min-w-0">
                    <span className="block">{r.label || panelName}</span>
                    {r.label && <span className="block text-[11px] opacity-70">{panelName}</span>}
                    {!ok && <span className="block text-[11px]">（參考面板 {r.panel} 不存在）</span>}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function NotesList({ notes }) {
      if (!Array.isArray(notes) || !notes.length) return null;
      return (
        <div className="mt-6 pt-4 border-t border-slate-100">
          <h3 className="flex items-center gap-2 text-sm font-bold text-slate-600 mb-2.5"><IconInfo /> 相關備註</h3>
          <ul className="space-y-2">
            {notes.map((k, i) => (
              k in FOOTNOTES
                ? <li key={i} className="text-sm text-slate-600 bg-slate-50 p-3 rounded-lg border border-slate-100 leading-relaxed"><RichText text={FOOTNOTES[k]} /></li>
                : <li key={i} className="text-sm text-red-700 bg-red-50 p-3 rounded-lg border border-red-100">缺少註腳：<code>{k}</code></li>
            ))}
          </ul>
        </div>
      );
    }

    function NextSteps({ steps, go }) {
      if (!Array.isArray(steps) || !steps.length) return null;
      return (
        <div className="mt-6 pt-4 border-t-2 border-brand-100">
          <h3 className="flex items-center gap-2 text-sm font-bold text-brand-700 mb-2.5"><IconArrowRight /> 後續評估路徑</h3>
          <div className="flex flex-col gap-2">
            {steps.map((s, i) => (
              <button key={i} onClick={() => go(s.next)}
                className="text-left w-full px-4 py-3 bg-brand-50 border border-brand-100 rounded-xl hover:bg-brand-100 hover:border-brand-500 transition-all text-brand-700 font-medium text-sm flex justify-between items-center gap-3 group min-h-[48px]">
                <span className="min-w-0">
                  <span className="whitespace-pre-line">{s.label}</span>
                  {!TREE[s.next] && <span className="block text-xs text-red-600 mt-0.5">⚠ 目標節點不存在：{s.next}</span>}
                </span>
                <span className="opacity-50 group-hover:opacity-100 transition-opacity flex-shrink-0"><IconArrowRight /></span>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function QuestionView({ node, go, openRef }) {
      const opts = Array.isArray(node.options) ? node.options : [];
      return (
        <div>
          <p className="text-[11px] font-semibold tracking-wider uppercase text-slate-400 mb-1">決策問題</p>
          <h2 className="text-xl sm:text-2xl font-bold text-brand-900 mb-4 border-l-4 border-accent-500 pl-3.5 py-0.5 leading-snug whitespace-pre-line">{node.question}</h2>
          {node.extra && <RichText text={node.extra} className="text-sm text-slate-600 bg-blue-50 border border-blue-100 rounded-lg p-3 mb-5 leading-relaxed" />}
          <TagRow tags={node.tags} className="mb-4" />
          <div className="flex flex-col gap-2.5">
            {opts.map((opt, i) => {
              const missing = !TREE[opt.next];
              const firstShortcut = opt.shortcut && !opts.slice(0, i).some(o => o && o.shortcut);
              return (
                <React.Fragment key={i}>
                {firstShortcut && <div className="mt-2 pt-3 border-t border-dashed border-slate-200 text-xs font-semibold tracking-wider uppercase text-slate-400">直接查詢（捷徑）</div>}
                <button onClick={() => go(opt.next)}
                  className={(opt.shortcut ? "text-left w-full px-4 py-3 bg-white border border-dashed border-slate-300 rounded-xl" : "text-left w-full px-4 sm:px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-xl") +  " hover:bg-brand-50 hover:border-brand-100 hover:shadow-sm active:scale-[.99] transition-all duration-200 text-slate-800 flex justify-between items-center gap-3 group min-h-[54px]"}>
                  <span className="min-w-0 flex-1">
                    <span className={"block leading-snug whitespace-pre-line " + (opt.shortcut ? "font-medium text-sm sm:text-base text-slate-700" : "font-medium text-[15px] sm:text-lg")}>{opt.label}</span>
                    {opt.sub && <span className="block text-xs sm:text-sm text-slate-500 mt-1 whitespace-pre-line">{opt.sub}</span>}
                    {missing && <span className="block text-xs text-red-600 mt-1">⚠ 目標節點不存在：{opt.next}</span>}
                  </span>
                  <span className="text-brand-500 opacity-40 group-hover:opacity-100 group-hover:translate-x-0.5 transition flex-shrink-0"><IconChevronRight size={20} /></span>
                </button>
                </React.Fragment>
              );
            })}
            {!opts.length && <Notice tone="red">此節點沒有任何選項（資料不完整）。</Notice>}
          </div>
          <RefLinks refs={node.refs} openRef={openRef} />
          <NotesList notes={node.notes} />
        </div>
      );
    }

    function ResultView({ node, go, openRef }) {
      const tone = TONES[node.type] || TONES.neutral;
      const content = String(node.content || '');
      const isLong = content.length > 140 || content.split(/\n/).length > 5;
      return (
        <div>
          <div className="flex items-center gap-3 mb-4">
            <div className={'p-2.5 rounded-full flex-shrink-0 ' + tone.icon}><IconClipboard /></div>
            <div className="min-w-0">
              <p className="text-[11px] font-semibold tracking-wider uppercase text-slate-400">建議結果</p>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-800 leading-tight">{node.title || '建議'}</h2>
            </div>
          </div>
          <div className={'p-5 sm:p-6 rounded-2xl border shadow-sm ' + tone.card}>
            <RichText text={content} className={isLong ? 'text-[15px] sm:text-[17px] font-semibold leading-relaxed' : 'text-[17px] sm:text-xl font-bold leading-relaxed'} />
            {node.extra && <RichText text={node.extra} className="mt-4 text-sm sm:text-base opacity-90 leading-relaxed border-t border-black/10 pt-4" />}
            <TagRow tags={node.tags} className="mt-4" />
          </div>
          <RefLinks refs={node.refs} openRef={openRef} />
          <NotesList notes={node.notes} />
          <NextSteps steps={node.nextSteps} go={go} />
        </div>
      );
    }

    function MissingNode({ id, onBack, onHome }) {
      return (
        <div role="alert" className="text-center py-6">
          <div className="mx-auto w-14 h-14 rounded-full bg-red-50 text-red-600 flex items-center justify-center mb-3"><IconAlert size={28} /></div>
          <h2 className="text-lg font-bold text-slate-800">找不到決策節點</h2>
          <p className="mt-1.5 text-sm text-slate-500">節點 <code className="px-1.5 py-0.5 bg-slate-100 rounded text-red-700">{id}</code> 不存在於目前載入的資料中。</p>
          <p className="mt-1 text-xs text-slate-400">可能是資料檔尚未完成、載入失敗，或連結中的節點 id 有誤。</p>
          <div className="mt-5 flex justify-center gap-2">
            <ToolbarBtn onClick={onBack} icon={<IconChevronLeft size={18} />} label="返回上一步" />
            <ToolbarBtn onClick={onHome} icon={null} label="回首頁" />
          </div>
        </div>
      );
    }

    function TreeView({ route, navigate, openRef, openPages, openSearch, copyLink }) {
      const { mode, ids, from } = route;
      const curId = ids[ids.length - 1];
      const node = TREE[curId];
      const go = (next) => navigate(treeHash(mode, ids.concat([next]), from));
      const back = () => {
        if (ids.length > 1) navigate(treeHash(mode, ids.slice(0, -1), from));
        else if (mode === 'node' && from === 'stage') navigate('#/stage');
        else if (mode === 'node') { navigate('#/'); openSearch(); }
        else navigate('#/');
      };
      const fullPath = mode === 'node' ? pathFromRoot(ids[0]) : null;
      return (
        <div className="animate-fade-in">
          <div className="flex items-center gap-2 mb-4 no-print">
            <ToolbarBtn onClick={back} icon={<IconChevronLeft size={18} />} label="返回上一步" />
            <ToolbarBtn onClick={() => navigate('#/path/root')} icon={<IconRefresh />} label="重新開始" tone="danger" />
            <ToolbarBtn onClick={copyLink} icon={<IconLink />} label="複製連結" hideLabelOnMobile className="ml-auto" />
          </div>
          {fullPath && fullPath.length > 1 && (
            <div className="mb-4 rounded-xl border border-sky-100 bg-sky-50/70 px-3.5 py-2.5 text-xs text-slate-600">
              <div className="flex items-center gap-1.5 font-semibold text-accent-600 mb-1"><IconPin size={14} />此節點在決策樹中的位置</div>
              <p className="leading-relaxed">{fullPath.map((id, i) => (i === 0 ? defaultLabel(id) : labelFor(fullPath[i - 1], id))).map(s => truncate(s, 28)).join(' › ')}</p>
              <button onClick={() => navigate(treeHash('path', fullPath.concat(ids.slice(1))))} className="mt-1.5 font-semibold text-accent-600 hover:underline">以完整路徑檢視 →</button>
            </div>
          )}
          <div key={ids.join('/')} className="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 sm:p-8 animate-fade-in">
            {!node ? <MissingNode id={curId} onBack={back} onHome={() => navigate('#/')} />
              : node.isResult ? <ResultView node={node} go={go} openRef={openRef} />
                : <QuestionView node={node} go={go} openRef={openRef} />}
            {node && <SourceRow pages={node.source} openPages={openPages} className="mt-6 pt-4 border-t border-slate-100" />}
          </div>
        </div>
      );
    }

    /* =====================================================================
     * 8. HOME
     * ===================================================================== */
    function HomeView({ navigate, openSearch, openRef, openPages }) {
      const root = TREE.root;
      const groups = GROUPS.map(g => Object.assign({}, g, { panels: PANELS.filter(p => p.group === g.key) })).filter(g => g.panels.length);
      const tileCls = 'flex flex-col items-center justify-center gap-1.5 text-center bg-white border border-slate-200 rounded-2xl px-2 py-4 shadow-sm hover:border-accent-500 hover:shadow transition min-h-[96px]';
      return (
        <div className="space-y-5 animate-fade-in">
          <section className="hero relative overflow-hidden rounded-2xl text-white px-5 py-6 sm:px-8 sm:py-8 shadow-md">
            <span className="absolute -right-6 -bottom-8 text-white/10 pointer-events-none"><IconEsophagus size={170} sw={1.2} /></span>
            <p className="relative text-[11px] sm:text-xs tracking-[.16em] uppercase text-sky-100/80 font-semibold">{META.subtitle || 'Practice Guidelines: Esophageal Cancer'}</p>
            <h2 className="relative text-2xl sm:text-3xl font-bold mt-1.5 leading-tight">{META.title || '食道癌多專科診療指引'}</h2>
            <div className="relative mt-3 flex flex-wrap gap-2 text-xs">
              {META.version && <span className="glass-chip">{META.version}</span>}
              {META.team && <span className="glass-chip">{META.team}</span>}
            </div>
          </section>

          <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6">
            <div className="flex items-center gap-2 text-brand-700 mb-1"><IconBranch size={18} /><h3 className="font-bold">開始決策流程</h3></div>
            {root ? (
              <>
                <p className="text-sm text-slate-500 mb-4">{root.question}</p>
                <div className="flex flex-col gap-2.5">
                  {(root.options || []).filter(o => !o.shortcut).map((o, i) => (
                    <button key={i} onClick={() => navigate(treeHash('path', ['root', o.next]))}
                      className="text-left w-full px-4 sm:px-5 py-4 rounded-xl border border-brand-100 bg-gradient-to-r from-brand-50 to-white hover:from-sky-50 hover:border-accent-500 hover:shadow-sm active:scale-[.99] transition flex items-center gap-3 group min-h-[60px]">
                      <span className="w-8 h-8 rounded-full bg-brand-700 text-white text-sm font-bold flex items-center justify-center flex-shrink-0 group-hover:bg-accent-600 transition-colors">{i + 1}</span>
                      <span className="min-w-0 flex-1">
                        <span className="block font-semibold text-slate-800 text-[15px] sm:text-lg leading-snug">{o.label}</span>
                        {o.sub && <span className="block text-xs sm:text-sm text-slate-500 mt-0.5">{o.sub}</span>}
                        {!TREE[o.next] && <span className="block text-xs text-red-600 mt-0.5">⚠ 節點 {o.next} 尚未建立</span>}
                      </span>
                      <span className="text-brand-500 flex-shrink-0"><IconChevronRight size={20} /></span>
                    </button>
                  ))}
                </div>
                {(root.options || []).some(o => o.shortcut) && (
                  <div className="mt-5 pt-4 border-t border-dashed border-slate-200">
                    <p className="text-xs font-semibold tracking-wider uppercase text-slate-400 mb-2">直接查詢（捷徑）</p>
                    <p className="text-xs text-slate-500 mb-3">病人已完成初始治療時，可直接跳到治療後評估；內容與上方流程走到的節點相同。</p>
                    <div className="flex flex-col gap-2">
                      {(root.options || []).filter(o => o.shortcut).map((o, i) => (
                        <button key={'s' + i} onClick={() => navigate(treeHash('path', ['root', o.next]))}
                          className="text-left w-full px-4 py-3 rounded-xl border border-dashed border-slate-300 bg-white hover:bg-slate-50 hover:border-brand-300 active:scale-[.99] transition flex items-center gap-3 group min-h-[48px]">
                          <span className="text-slate-400 group-hover:text-brand-600 flex-shrink-0"><IconSearch size={16} /></span>
                          <span className="min-w-0 flex-1">
                            <span className="block font-medium text-slate-700 text-sm sm:text-base leading-snug">{o.label}</span>
                            {o.sub && <span className="block text-xs text-slate-500 mt-0.5">{o.sub}</span>}
                            {!TREE[o.next] && <span className="block text-xs text-red-600 mt-0.5">⚠ 節點 {o.next} 尚未建立</span>}
                          </span>
                          <span className="text-slate-400 flex-shrink-0"><IconChevronRight size={18} /></span>
                        </button>
                      ))}
                    </div>
                  </div>
                )}
              </>
            ) : (
              <Notice tone="red">決策樹資料尚未載入（找不到 <code>root</code> 節點）。請確認 <code>data/10_tree_scc.js</code>、<code>data/15_tree_adeno.js</code> 已存在並可正常載入。</Notice>
            )}
          </section>

          <section className="grid grid-cols-3 gap-2.5 sm:gap-3">
            <button onClick={() => navigate('#/stage')} className={tileCls}>
              <span className="text-accent-600"><IconCalc size={24} /></span>
              <span className="text-sm font-bold text-slate-800">分期計算器</span><span className="text-[11px] text-slate-400">{STAGE_EDITION || 'TNM'}</span>
            </button>
            <button onClick={openSearch} className={tileCls}>
              <span className="text-accent-600"><IconSearch size={24} /></span>
              <span className="text-sm font-bold text-slate-800">全文搜尋</span><span className="text-[11px] text-slate-400">快捷鍵 /</span>
            </button>
            {HAS_PAGES ? (
              <button onClick={() => openPages([], 1)} className={tileCls}>
                <span className="text-accent-600"><IconFile size={24} /></span>
                <span className="text-sm font-bold text-slate-800">原始指引</span><span className="text-[11px] text-slate-400">共 {TOTAL_PAGES} 張投影片</span>
              </button>
            ) : (
              <button onClick={() => openRef(null)} className={tileCls}>
                <span className="text-accent-600"><IconBook size={24} /></span>
                <span className="text-sm font-bold text-slate-800">參考資料</span><span className="text-[11px] text-slate-400">{PANELS.length} 個面板</span>
              </button>
            )}
          </section>

          <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6">
            <div className="flex items-center gap-2 text-brand-700 mb-4"><IconBook size={18} /><h3 className="font-bold">參考資料</h3></div>
            {!groups.length && <p className="text-sm text-slate-400">尚無參考資料面板。</p>}
            <div className="space-y-5">
              {groups.map(g => (
                <div key={g.key}>
                  <h4 className="text-xs font-bold tracking-wider text-slate-400 mb-2">{g.label} <span className="font-normal">{g.en}</span></h4>
                  <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    {g.panels.map(p => {
                      const d = REF_DATA[p.key];
                      const pages = d && HAS_PAGES ? normPages(d.source) : [];
                      // no page numbers (META.sourcePages = 0): show the title's remainder, e.g. "術前檢查 (Workup)" → "Workup"
                      const rest = d && d.title && d.title.indexOf(p.label) === 0 ? d.title.slice(p.label.length).trim().replace(/^[(（](.*)[)）]$/, '$1') : '';
                      const sub = !p.available ? '尚未提供' : pages.length ? 'p.' + compressPages(pages) : rest;
                      return (
                        <button key={p.key} disabled={!p.available} onClick={() => openRef(p.key)}
                          className={'text-left rounded-xl border px-3 py-2.5 min-h-[56px] transition ' + (p.available ? 'bg-slate-50 border-slate-200 hover:bg-brand-50 hover:border-brand-500' : 'bg-slate-50/50 border-dashed border-slate-200 opacity-60 cursor-not-allowed')}>
                          <span className="block text-sm font-semibold text-slate-700 leading-snug">{p.label}</span>
                          {sub && <span className="block text-[11px] text-slate-400 mt-0.5 truncate">{sub}</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </section>

          {USED_TAG_LEVELS.length >= 3 && (
          <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6">
            <div className="flex items-center gap-2 text-brand-700 mb-3"><IconTag size={18} /><h3 className="font-bold">標籤說明</h3></div>
            <div className="flex flex-wrap gap-2">
              {USED_TAG_LEVELS.map(k => <span key={k} className={'tag tag-' + k}>{TAG_LEVELS[k]}</span>)}
            </div>
            {USED_TAG_LEVELS.some(k => TAG_SOURCE_TERMS[k]) && (
              <p className="mt-3 text-xs text-slate-500">標籤對應指引原文的分類：{USED_TAG_LEVELS.filter(k => TAG_SOURCE_TERMS[k]).map(k => TAG_SOURCE_TERMS[k] + ' → ' + TAG_LEVELS[k]).join('、')}。</p>
            )}
          </section>
          )}

          {INTEGRITY.total > 0 && (
            <details className="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-xs text-amber-900">
              <summary className="cursor-pointer font-semibold">資料完整性提醒：{INTEGRITY.total} 處連結指向不存在的項目</summary>
              <ul className="mt-2 space-y-0.5 list-disc pl-5 break-words">
                {INTEGRITY.broken.map((s, i) => <li key={'b' + i}>節點連結：{s}</li>)}
                {INTEGRITY.notes.map((s, i) => <li key={'n' + i}>註腳：{s}</li>)}
                {INTEGRITY.panels.map((s, i) => <li key={'p' + i}>參考面板：{s}</li>)}
              </ul>
            </details>
          )}
        </div>
      );
    }

    /* =====================================================================
     * 9. STAGE CALCULATOR — multi-scheme, multi-axis (SPEC §2.3). Nothing clinical is hard-coded here:
     *    schemes, axes, items, definitions, grouping and entry nodes ALL come from ECG.STAGE_TABLE.
     *
     *    ECG.STAGE_TABLE = { edition?, title?, source?, defs?: { AXIS: [{ id, label?, def? }] },
     *      schemes: [{ key, label, sub?, note?, source?, ref?: { panel, anchor?, label? },
     *                  axes: [{ key, label?, en?, items?: [{ id, label?, def? } | "id"] }],   // items default to defs[key]
     *                  group(values) → stage string | null,          // values = { T: "T2", N: "N0", M: "M0", … }
     *                  entry(stage, values) → "id" | ["id", …] | { id, why } | [{ id, why }, …] }] }
     *    Item label/def missing → looked up in defs[axis.key] by id.
     *    Legacy single-scheme format (thymic / lung apps): { T:[…], N:[…], M:[…], group(t, n, m), entry(stage, t, n, m) }
     *    → wrapped as ONE scheme with key "" so its URLs stay #/stage/T/N/M.
     *    URL: #/stage/<schemeKey>/<v1>/<v2>/… (values in axes order, written once every axis is chosen;
     *    #/stage/<schemeKey> while incomplete). STAGE_TABLE may be null (content not loaded yet) → notice, no crash.
     * ===================================================================== */
    const STAGE_EDITION = (STAGE_TABLE && STAGE_TABLE.edition) ? String(STAGE_TABLE.edition) : '';
    const AXIS_META = {
      T: { label: '原發腫瘤 (T)', en: 'Primary tumor' },
      N: { label: '區域淋巴結 (N)', en: 'Regional lymph nodes' },
      M: { label: '遠端轉移 (M)', en: 'Distant metastasis' },
      G: { label: '組織分化 (G)', en: 'Histologic grade' },
      L: { label: '腫瘤位置 (L)', en: 'Tumor location' }
    };
    const STAGE_SRC_DEFAULT = [];
    const idOfItem = (x) => (x == null ? '' : (typeof x === 'object' ? (x.id == null ? '' : String(x.id)) : String(x)));
    function normStageItem(x, defsArr) {
      const id = idOfItem(x);
      if (!id) return null;
      const d = (defsArr || []).find(y => idOfItem(y) === id);
      const dd = d && typeof d === 'object' ? d : {};
      const o = typeof x === 'object' ? x : {};
      return { id, label: String(o.label || dd.label || id), def: String(o.def || dd.def || '') };
    }
    function normStageAxis(a, defs) {
      if (!a) return null;
      const key = typeof a === 'string' ? a : String(a.key || '');
      if (!key) return null;
      const o = typeof a === 'object' ? a : {};
      const meta = AXIS_META[key] || {};
      const defsArr = defs && Array.isArray(defs[key]) ? defs[key] : [];
      const raw = Array.isArray(o.items) ? o.items : defsArr;
      const seen = new Set();
      const items = raw.map(x => normStageItem(x, defsArr)).filter(x => x && !seen.has(x.id) && seen.add(x.id));
      return { key, label: String(o.label || meta.label || key), en: String(o.en || meta.en || ''), items };
    }
    const STAGE_LEGACY = !!(STAGE_TABLE && typeof STAGE_TABLE === 'object' && !Array.isArray(STAGE_TABLE.schemes) &&
      ['T', 'N', 'M'].some(k => Array.isArray(STAGE_TABLE[k])));
    const STAGE_SCHEMES = (() => {
      const ST = STAGE_TABLE;
      if (!ST || typeof ST !== 'object') return [];
      const defs = ST.defs && typeof ST.defs === 'object' ? ST.defs : {};
      try {
        if (Array.isArray(ST.schemes)) {
          const seen = new Set();
          return ST.schemes
            .filter(s => s && typeof s === 'object' && s.key != null && String(s.key) && !seen.has(String(s.key)) && seen.add(String(s.key)))
            .map(s => ({
              key: String(s.key), label: String(s.label || s.key), sub: s.sub ? String(s.sub) : '', note: s.note ? String(s.note) : '',
              axes: (Array.isArray(s.axes) ? s.axes : []).map(a => normStageAxis(a, defs)).filter(Boolean),
              group: typeof s.group === 'function' ? (v) => s.group(v) : null,
              entry: typeof s.entry === 'function' ? (g, v) => s.entry(g, v) : null,
              source: s.source || ST.source || STAGE_SRC_DEFAULT,
              ref: s.ref && s.ref.panel ? { panel: String(s.ref.panel), anchor: s.ref.anchor ? String(s.ref.anchor) : null, label: s.ref.label ? String(s.ref.label) : '' } : null
            }));
        }
        if (STAGE_LEGACY) {
          return [{
            key: '', legacy: true, label: String(ST.title || ST.label || 'TNM'), sub: '', note: '',
            axes: ['T', 'N', 'M'].map(k => normStageAxis({ key: k, items: Array.isArray(ST[k]) ? ST[k] : [] }, defs)),
            group: typeof ST.group === 'function' ? (v) => ST.group(v.T, v.N, v.M) : null,
            entry: typeof ST.entry === 'function' ? (g, v) => ST.entry(g, v.T, v.N, v.M) : null,
            source: ST.source || STAGE_SRC_DEFAULT, ref: null
          }];
        }
      } catch (e) { console.warn('[ECG] cannot read STAGE_TABLE', e); }
      return [];
    })();
    const schemeByKey = (k) => (k == null ? null : STAGE_SCHEMES.find(s => s.key === String(k)) || null);
    const itemOf = (axis, id) => (axis && id ? axis.items.find(x => x.id === id) || null : null);

    function calcStage(scheme, vals) {
      if (!scheme || !scheme.group) return { err: 'group() 未提供' };
      try {
        const g = scheme.group(Object.assign({}, vals));
        return { g: g == null || g === '' ? null : String(g) };
      } catch (e) { return { err: String((e && e.message) || e) }; }
    }
    // Real stage labels only ("0", "I", "IIA", "IVB", or combos like "IIIB/IVA"); anything else (e.g. "無對應分期") = no stage.
    const STAGE_RE = /^(0|IV[AB]?|I{1,3}[ABC]?[1-3]?)(\/(0|IV[AB]?|I{1,3}[ABC]?[1-3]?))*$/;
    const asStage = (g) => (g && STAGE_RE.test(g) ? g : null);
    function stageTone(g) {
      if (!g) return 'none';
      if (/^IV/.test(g)) return 'iv';
      if (/^III/.test(g)) return 'iii';
      if (/^II/.test(g)) return 'ii';
      if (/^I/.test(g)) return 'i';
      return 'zero';
    }
    // entry(stage, values) → "id" | ["id", …] | {id, why} | [{id, why}, …]  (why = optional hint text).
    // First item = primary button "以此分期進入決策樹"; the rest = "或進入".
    // Missing / throws / returns nothing → a_entry (IVA–IVB) / m_entry (others) when those nodes exist, else root.
    function stageEntries(scheme, stage, vals) {
      let out = [];
      try {
        if (scheme && scheme.entry) {
          const r = scheme.entry(stage, Object.assign({}, vals));
          out = (Array.isArray(r) ? r : [r])
            .map(x => (typeof x === 'string' ? { id: x, why: '' } : (x && x.id ? { id: String(x.id), why: String(x.why || x.label || '') } : null)))
            .filter(x => x && x.id);
        }
      } catch (e) { console.warn('[ECG] STAGE_TABLE entry() failed', e); }
      const seen = new Set();
      out = out.filter(x => (seen.has(x.id) ? false : (seen.add(x.id), true)));
      if (out.length) return out;
      const fb = /^IV/.test(stage || '') ? 'a_entry' : 'm_entry';
      return [{ id: TREE[fb] ? fb : 'root', why: '' }];
    }
    function stageSelFrom(scheme, vals) {
      const o = {};
      (scheme ? scheme.axes : []).forEach((a, i) => { const v = vals ? vals[i] : null; o[a.key] = v != null && itemOf(a, String(v)) ? String(v) : null; });
      return o;
    }
    const stageComplete = (scheme, sel) => !!scheme && scheme.axes.length > 0 && scheme.axes.every(a => sel && sel[a.key]);
    function stageHash(scheme, sel) {
      if (!scheme) return '#/stage';
      const vals = stageComplete(scheme, sel) ? scheme.axes.map(a => enc(sel[a.key])) : [];
      const parts = (scheme.legacy ? [] : [enc(scheme.key)]).concat(vals);
      return '#/stage' + (parts.length ? '/' + parts.join('/') : '');
    }
    // URL preset (#/stage/…) → { key, sel }. Unknown first segment (e.g. an old-style #/stage/T3/N0/M0 link)
    // → the preferred / first scheme whose first axis knows that value; values are positional, invalid ones ignored.
    function stageFromPreset(pre, preferKey) {
      if (!STAGE_SCHEMES.length) return { key: null, sel: {} };
      let s = null, vals = pre || [];
      if (STAGE_SCHEMES[0].legacy) s = STAGE_SCHEMES[0];
      else if (vals.length && schemeByKey(vals[0])) { s = schemeByKey(vals[0]); vals = vals.slice(1); }
      else {
        const cands = [schemeByKey(preferKey)].concat(STAGE_SCHEMES).filter(Boolean);
        s = (vals.length && cands.find(c => c.axes[0] && itemOf(c.axes[0], vals[0]))) || cands[0];
      }
      return { key: s.key, sel: stageSelFrom(s, vals) };
    }
    let STAGE_LAST = null;   // last calculator state; a bare #/stage (header button, "back") restores it

    function StageView({ route, navigate, goNode, openRef, openPages }) {
      const pre = route.preset || [];
      const presetKey = pre.join('/');
      const [st, setSt] = useState(() => (!pre.length && STAGE_LAST && schemeByKey(STAGE_LAST.key) ? STAGE_LAST : stageFromPreset(pre, STAGE_LAST && STAGE_LAST.key)));
      const [showDefs, setShowDefs] = useState(false);
      const [gridPick, setGridPick] = useState(null);
      const scheme = schemeByKey(st.key);
      const sel = st.sel || {};
      const axes = scheme ? scheme.axes : [];
      const curHash = stageHash(scheme, sel);

      useEffect(() => {
        STAGE_LAST = st;
        if (scheme && (window.location.hash || '') !== curHash) navigate(curHash, { replace: true });
      }, [curHash]);
      // Hash changed while the calculator stays mounted (a #/stage/… link inside a panel, the header button)
      // → re-sync from the URL; a bare #/stage keeps the current state (and rewrites the URL to match it).
      useEffect(() => {
        if (!presetKey) {
          if (scheme && (window.location.hash || '') !== curHash) navigate(curHash, { replace: true });
          return;
        }
        const p = stageFromPreset(pre, st.key);
        if (stageHash(schemeByKey(p.key), p.sel) !== curHash) setSt(p);
      }, [presetKey]);

      const hasAxes = axes.length > 0 && axes.every(a => a.items.length > 0);
      const ready = hasAxes && !!(scheme && scheme.group);
      const complete = stageComplete(scheme, sel);
      const result = complete && ready ? calcStage(scheme, sel) : null;
      const rawG = result && result.g;
      const g = asStage(rawG);
      const entries = g ? stageEntries(scheme, g, sel) : [];
      const multi = STAGE_SCHEMES.length > 1;
      const anySel = axes.some(a => sel[a.key]);

      // T × N grid (one per value of the 3rd axis, switchable) — only for schemes with 2–3 axes
      const showGrid = ready && axes.length >= 2 && axes.length <= 3;
      const rowAx = axes[0], colAx = axes[1], pageAx = axes.length === 3 ? axes[2] : null;
      const pageSel = pageAx ? sel[pageAx.key] : null;
      useEffect(() => { setGridPick(null); }, [pageSel, st.key]);
      const gridPage = pageAx ? ((gridPick && itemOf(pageAx, gridPick)) ? gridPick : (pageSel || (pageAx.items[0] && pageAx.items[0].id))) : null;
      const grid = useMemo(() => {
        if (!showGrid) return null;
        return rowAx.items.map(r => colAx.items.map(c => {
          const v = { [rowAx.key]: r.id, [colAx.key]: c.id };
          if (pageAx) v[pageAx.key] = gridPage;
          return calcStage(scheme, v);
        }));
      }, [st.key, gridPage, showGrid]);

      const pickScheme = (k) => {
        const ns = schemeByKey(k);
        if (!ns || ns.key === st.key) return;
        // carry over the values the new scheme also offers (e.g. cTNM → pTNM keeps N0 / M0)
        const nsel = {};
        ns.axes.forEach(a => { const v = sel[a.key]; nsel[a.key] = v && itemOf(a, v) ? v : null; });
        setSt({ key: ns.key, sel: nsel });
      };
      const pick = (axisKey, v) => setSt(s => ({ key: s.key, sel: Object.assign({}, s.sel, { [axisKey]: v }) }));
      const clear = () => setSt(s => ({ key: s.key, sel: {} }));

      const stPages = normPages((scheme && scheme.source) || (STAGE_TABLE && STAGE_TABLE.source) || STAGE_SRC_DEFAULT);
      const schemeRef = scheme ? (scheme.ref || (scheme.key && panelHasAnchor('TNM', scheme.key) ? { panel: 'TNM', anchor: scheme.key, label: '' } : null)) : null;
      const hasMasaoka = !!REF_DATA.MASAOKA;   // thymic data only
      const axisKeys = axes.map(a => a.key).join(' / ');

      let status;
      if (!STAGE_TABLE) status = '分期表 (STAGE_TABLE) 尚未載入，暫時無法計算。';
      else if (!scheme) status = '分期表格式不完整（找不到 schemes），暫時無法計算。';
      else if (!hasAxes) status = '分期表的選項清單不完整，暫時無法計算。';
      else if (!ready) status = '分期表缺少 group()，暫時無法計算。';
      else if (!complete) status = '請選擇 ' + axes.filter(a => !sel[a.key]).map(a => a.key).join('、') + '。';
      else if (result.err) status = '計算錯誤：' + result.err;
      else if (!g) status = rawG ? '分期表結果：' + rawG : '此組合在分期表中沒有對應的分期。';
      else status = (STAGE_EDITION ? STAGE_EDITION + ' ' : '') + 'Stage ' + g;

      const axisGrid = (a) => {
        const long = a.items.some(x => x.label.length > 4);
        if (long) return { long, cls: 'grid gap-1.5', style: { gridTemplateColumns: 'repeat(auto-fill, minmax(4.5rem, 1fr))' } };
        return { long, cls: 'grid gap-1.5 ' + (a.items.length > 5 ? 'grid-cols-5 sm:grid-cols-9' : 'grid-cols-5'), style: undefined };
      };

      return (
        <div className="space-y-4 animate-fade-in">
          <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-6">
            <p className="text-[11px] tracking-wider font-semibold text-slate-400">分期計算器{STAGE_EDITION ? ' · ' + STAGE_EDITION : ''}</p>
            <h2 className="text-xl font-bold text-brand-900 leading-snug">{(STAGE_TABLE && STAGE_TABLE.title) || (multi ? 'TNM 分期' : (scheme ? scheme.label + ' 分期' : 'TNM 分期'))}</h2>
            <div className="mt-2.5 flex flex-wrap items-center gap-1.5">
              {REF_DATA.TNM && <button onClick={() => openRef('TNM')} className="mini-btn"><IconBook size={14} />TNM 定義</button>}
              {schemeRef && REF_DATA[schemeRef.panel] && (
                <button onClick={() => openRef(schemeRef.panel, schemeRef.anchor || null)} className="mini-btn" data-scheme-ref={scheme.key}>
                  <IconBook size={14} />{schemeRef.label || '分期表：' + scheme.label}
                </button>
              )}
              {hasMasaoka && <a href="#/ref/MASAOKA" onClick={(e) => { e.preventDefault(); openRef('MASAOKA'); }} className="mini-btn"><IconBook size={14} />Masaoka 分期對照</a>}
              {anySel && <button onClick={clear} className="mini-btn ml-auto">清除</button>}
            </div>

            {multi && (
              <div className="mt-4">
                <p className="text-xs font-semibold text-slate-500 mb-1.5">分期系統</p>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5" aria-label="分期系統">
                  {STAGE_SCHEMES.map(s => (
                    <button key={s.key} onClick={() => pickScheme(s.key)} aria-pressed={s.key === st.key} data-scheme={s.key}
                      className={'scheme-btn ' + (s.key === st.key ? 'on' : '')}>
                      {s.label}{s.sub ? <span className="scheme-sub">{s.sub}</span> : null}
                    </button>
                  ))}
                </div>
              </div>
            )}
            {scheme && scheme.note && <RichText text={scheme.note} className="mt-3 text-xs text-slate-600 bg-slate-50 border border-slate-100 rounded-lg px-3 py-2 leading-relaxed" />}

            {!ready && (
              <div className="mt-4">
                <Notice tone="amber">分期表資料 (<code>ECG.STAGE_TABLE</code>) 尚未提供{STAGE_TABLE ? '或不完整' : ''}，可先參考 TNM 分期面板{hasMasaoka ? '、Masaoka 分期對照' : ''}。</Notice>
                {!hasAxes && <SourceRow pages={stPages} openPages={openPages} />}
              </div>
            )}
            {hasAxes && (
              <div className="mt-4 flex items-center gap-4">
                <div className={'stage-badge st-' + (result && result.err ? 'err' : stageTone(g))} aria-live="polite">{result && result.err ? '!' : (g || '—')}</div>
                <div className="min-w-0">
                  {multi && <p className="text-xs font-semibold text-accent-600 mb-1">{scheme.label}</p>}
                  <div className="flex flex-wrap gap-1.5">
                    {axes.map(a => {
                      const it = itemOf(a, sel[a.key]);
                      return <span key={a.key} className={'px-2.5 py-1 rounded-full text-sm font-bold border ' + (it ? 'bg-brand-700 text-white border-brand-700' : 'bg-white text-slate-300 border-dashed border-slate-300')}>{it ? it.label : a.key + ' ?'}</span>;
                    })}
                  </div>
                  <p className="mt-2 text-sm text-slate-600">{status}</p>
                </div>
              </div>
            )}
            {g && (
              <div className="mt-5 space-y-2">
                {entries.map((e, i) => (
                  <button key={e.id} onClick={() => goNode(e.id)} data-entry={e.id}
                    className={'w-full text-left flex items-center justify-between gap-3 px-4 py-3 rounded-xl transition min-h-[52px] ' + (i === 0 ? 'bg-brand-700 text-white hover:bg-brand-900 shadow' : 'bg-brand-50 text-brand-700 border border-brand-100 hover:border-brand-500')}>
                    <span className="min-w-0">
                      <span className="block font-bold">{i === 0 ? '以此分期進入決策樹' : '或進入'}</span>
                      <span className={'block text-xs mt-0.5 ' + (i === 0 ? 'text-brand-100' : 'text-slate-500')}>{TREE[e.id] ? defaultLabel(e.id) : '節點 ' + e.id + ' 尚未建立'}</span>
                      {e.why && <span className={'block text-xs mt-0.5 ' + (i === 0 ? 'text-brand-100' : 'text-slate-500')}>{e.why}</span>}
                    </span>
                    <IconArrowRight />
                  </button>
                ))}
              </div>
            )}
          </section>

          {hasAxes && axes.map(a => {
            const lay = axisGrid(a);
            const it = itemOf(a, sel[a.key]);
            return (
              <section key={a.key} className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5" data-axis={a.key}>
                <div className="flex items-baseline justify-between gap-2 mb-2.5">
                  <h3 className="font-bold text-brand-900">{a.label}</h3><span className="text-xs text-slate-400 text-right">{a.en}</span>
                </div>
                <div className={lay.cls} style={lay.style}>
                  {a.items.map(x => (
                    <button key={x.id} title={x.def || x.label} aria-pressed={sel[a.key] === x.id}
                      onClick={() => pick(a.key, x.id)}
                      className={'tnm-btn ' + (lay.long ? 'long ' : '') + (sel[a.key] === x.id ? 'on' : '')}>{x.label}</button>
                  ))}
                </div>
                {it && it.def && (
                  <p className="mt-2.5 text-sm text-slate-600 bg-slate-50 rounded-lg px-3 py-2 border border-slate-100 whitespace-pre-line leading-relaxed"><b className="text-brand-700">{it.label}</b>：{it.def}</p>

          {hasAxes && axes.some(a => a.items.some(x => x.def)) && (
            <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5">
              <button onClick={() => setShowDefs(v => !v)} aria-expanded={showDefs} className="w-full flex items-center justify-between gap-2 font-bold text-brand-900 min-h-[40px] text-left">
                <span>全部 {axisKeys} 定義</span><span className="text-sm font-medium text-accent-600 flex-shrink-0">{showDefs ? '收合' : '展開'}</span>
              </button>
              {showDefs && (
                <div className="mt-3 space-y-4">
                  {axes.filter(a => a.items.some(x => x.def)).map(a => (
                    <div key={a.key}>
                      <h4 className="text-xs font-bold text-slate-400 mb-1.5">{a.label}</h4>
                      <dl className="divide-y divide-slate-100 border border-slate-100 rounded-lg">
                        {a.items.map(x => (
                          <div key={x.id} className="flex gap-3 px-3 py-2 text-sm">
                            <dt className="w-16 flex-shrink-0 font-bold text-brand-700 break-words">{x.label}</dt>
                            <dd className="text-slate-600 whitespace-pre-line min-w-0">{x.def || <span className="text-slate-300">（未提供定義）</span>}</dd>

                      </dl>

                </div>
              )}
            </section>
          )}

          {grid && (
            <section className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5" data-stage-grid={scheme.key}>
              <div className="flex items-baseline justify-between mb-2 gap-2">
                <h3 className="font-bold text-brand-900">分期總表{pageAx ? '（' + ((itemOf(pageAx, gridPage) || {}).label || gridPage) + '）' : ''}</h3><span className="text-xs text-slate-400 text-right">點選格子可直接帶入</span>
              </div>
              {pageAx && pageAx.items.length > 1 && (
                <div className="flex flex-wrap gap-1.5 mb-2.5" aria-label={pageAx.label}>
                  {pageAx.items.map(x => (
                    <button key={x.id} onClick={() => setGridPick(x.id)} aria-pressed={gridPage === x.id} data-grid-page={x.id}
                      className={'mini-btn ' + (gridPage === x.id ? 'on' : '')}>{x.label}</button>
                  ))}
                </div>
              )}
              <div className="overflow-x-auto">
                <table className="stage-grid w-full text-center">
                  <thead><tr><th></th>{colAx.items.map(c => <th key={c.id} className={sel[colAx.key] === c.id ? 'on' : ''}>{c.label}</th>)}</tr></thead>
                  <tbody>
                    {rowAx.items.map((r, ri) => (
                      <tr key={r.id}>
                        <th className={'text-left ' + (sel[rowAx.key] === r.id ? 'on' : '')}>{r.label}</th>
                        {colAx.items.map((c, ci) => {
                          const cell = grid[ri][ci];
                          const cg = asStage(cell.g);
                          const isSel = sel[rowAx.key] === r.id && sel[colAx.key] === c.id && (!pageAx || sel[pageAx.key] === gridPage);
                          return (
                            <td key={c.id}>
                              <button onClick={() => setSt(s => ({ key: s.key, sel: Object.assign({}, s.sel, { [rowAx.key]: r.id, [colAx.key]: c.id }, pageAx ? { [pageAx.key]: gridPage } : {}) }))}
                                title={r.label + ' ' + c.label + (pageAx ? ' ' + gridPage : '') + ' → ' + (cell.err ? '錯誤：' + cell.err : (cell.g || '無對應'))}
                                className={'cell st-' + (cell.err ? 'err' : stageTone(cg)) + (isSel ? ' sel' : '')}>{cell.err ? '!' : (cg || '—')}</button>
                            </td>
                          );
                        })}
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <SourceRow pages={stPages} openPages={openPages} className="mt-3" />
            </section>
          )}
          {ready && !grid && axes.length > 3 && (
            <p className="text-xs text-slate-500 bg-white rounded-xl border border-slate-200 px-4 py-3 leading-relaxed">
              此分期系統有 {axes.length} 個欄位（{axisKeys}），不提供 {axes[0].key} × {axes[1].key} 總表；
              {schemeRef && REF_DATA[schemeRef.panel]
                ? <> 完整分期表請見 <button onClick={() => openRef(schemeRef.panel, schemeRef.anchor || null)} className="font-semibold text-accent-600 underline underline-offset-2">{schemeRef.label || '分期表：' + scheme.label}</button>。</>
                : ' 完整分期表請見 TNM 分期面板。'}
            </p>
          )}
          <p className="text-xs text-slate-400 text-center px-2">分期結果僅供參考，請依臨床與病理資料判斷後選擇決策節點{hasMasaoka ? '；Modified Masaoka 分期請見「Masaoka 分期對照」' : ''}。</p>
        </div>

    /* =====================================================================
     * 10. OVERLAYS: reference drawer, search, source-page viewer
     * ===================================================================== */
    function DrawerIndex({ onSelect }) {
      return (
        <div className="p-4 sm:p-5 space-y-5">
          {GROUPS.map(g => {
            const ps = PANELS.filter(p => p.group === g.key);
            if (!ps.length) return null;
            return (
              <div key={g.key}>
                <h4 className="text-xs font-bold tracking-wider text-slate-400 mb-2">{g.label} <span className="font-normal">{g.en}</span></h4>
                <div className="grid gap-2">
                  {ps.map(p => {
                    const d = REF_DATA[p.key]; const pages = d && HAS_PAGES ? normPages(d.source).filter(n => n <= TOTAL_PAGES) : [];
                    return (
                      <button key={p.key} disabled={!p.available} onClick={() => onSelect(p.key)}
                        className={'text-left rounded-xl border px-4 py-3 flex items-center justify-between gap-3 transition min-h-[56px] ' + (p.available ? 'bg-white border-slate-200 hover:bg-brand-50 hover:border-brand-500' : 'bg-slate-50 border-dashed border-slate-200 opacity-60 cursor-not-allowed')}>

                      </button>
                    );

                </div>
              </div>
            );
