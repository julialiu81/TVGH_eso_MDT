          {!PANELS.length && <p className="text-sm text-slate-400">尚無參考資料面板。</p>}
        </div>
      );
    }

    function Drawer({ panel, anchor, opts, wide, onToggleWide, onClose, onSelect, openPages, onInternalLink, onClearHighlight, copyLink }) {
      const data = panel ? REF_DATA[panel] : null;
      const meta = panel ? PANEL_BY_KEY[panel] : null;
      const html = useMemo(() => (data ? prepareRefHtml(data.content) : ''), [panel]);
      const bodyRef = useRef(null), scrollRef = useRef(null);
      const [toc, setToc] = useState([]);
      const [tocOpen, setTocOpen] = useState(false);
      const [missingAnchor, setMissingAnchor] = useState(null);
      const [hits, setHits] = useState(0);
      const contentKey = (panel || '') + ':' + ((opts && opts.nonce) || 0);

      useEffect(() => {
        const sc = scrollRef.current, el = bodyRef.current;
        setTocOpen(false);
        if (!sc) return;
        if (!el) { sc.scrollTop = 0; setToc([]); setHits(0); setMissingAnchor(null); return; }
        const heads = Array.from(el.querySelectorAll(HEAD_SEL));
        setToc(heads.map((h, i) => ({ i, text: norm(h.textContent), nested: h.tagName === 'H4' && !!h.closest('details') })));
        const terms = (opts && opts.terms) || [];
        const n = terms.length ? highlightDom(el, terms) : 0;
        setHits(n);
        let target = anchor ? findAnchorEl(el, panel, anchor) : null;
        setMissingAnchor(anchor && !target ? anchor : null);
        if (!target && opts && opts.headingIndex >= 0) target = heads[opts.headingIndex] || null;
        if (!target && n) target = el.querySelector('mark.hl');
        if (target) { revealEl(target); requestAnimationFrame(() => scrollToEl(target, sc)); }
        else sc.scrollTop = 0;
      }, [contentKey, anchor]);

      const jumpToc = (i) => {
        const el = bodyRef.current && bodyRef.current.querySelectorAll(HEAD_SEL)[i];
        setTocOpen(false);
        if (el) { revealEl(el); requestAnimationFrame(() => scrollToEl(el, scrollRef.current, true)); }
      };
      const onContentClick = (e) => {
        const a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a) return;
        const href = a.getAttribute('href') || '';
        if (href.indexOf('#/') === 0) { e.preventDefault(); onInternalLink(href); }
        else if (/^https?:/i.test(href)) { a.setAttribute('target', '_blank'); a.setAttribute('rel', 'noopener noreferrer'); }
      };
      const pages = data && HAS_PAGES ? normPages(data.source).filter(n => n <= TOTAL_PAGES) : [];

      return (
        <div className="fixed inset-0 z-40 flex justify-end" role="dialog" aria-modal="true" aria-label="參考資料">
          <div className="absolute inset-0 bg-brand-900/40 backdrop-blur-sm lcg-fade" onClick={onClose} />
          <div className={'relative w-full h-full bg-white shadow-2xl flex flex-col lcg-slide transition-[max-width] duration-300 ' + (wide ? 'max-w-3xl' : 'max-w-lg')}>
            <div className="flex items-center gap-1.5 px-2 sm:px-3 h-14 border-b border-slate-200 bg-slate-50 flex-shrink-0 safe-top">
              {panel
                ? <button onClick={() => onSelect(null)} className="p-2 rounded-full hover:bg-slate-200 text-slate-600 flex-shrink-0" title="全部參考資料" aria-label="全部參考資料"><IconChevronLeft /></button>
                : <span className="p-2 text-brand-700 flex-shrink-0"><IconBook /></span>}
              <div className="min-w-0 flex-1">
                <h3 className="font-bold text-brand-900 truncate text-[15px] sm:text-base leading-tight">{panel ? (data ? data.title : panel) : '參考資料'}</h3>
                <p className="text-[11px] text-slate-500 truncate">{panel ? (meta ? groupLabel(meta.group) + ' · ' + meta.label : '') : '依分組瀏覽 · 點選開啟'}</p>
              </div>
              <button onClick={onToggleWide} className="hidden sm:flex p-2 rounded-full hover:bg-slate-200 text-slate-500 flex-shrink-0" title={wide ? '恢復寬度' : '加寬面板'} aria-label={wide ? '恢復寬度' : '加寬面板'}><IconWiden /></button>
              <button onClick={onClose} className="p-2 rounded-full hover:bg-slate-200 text-slate-500 flex-shrink-0" aria-label="關閉"><IconX /></button>
            </div>
            {panel && data && (
              <div className="flex items-center gap-1.5 px-3 sm:px-4 py-2 border-b border-slate-100 bg-white flex-shrink-0 overflow-x-auto no-scrollbar">
                {pages.length > 0 && <button onClick={() => openPages(pages, pages[0])} className="mini-btn"><IconFile size={14} />原始頁面 p.{compressPages(pages)}</button>}
                {toc.length > 1 && <button onClick={() => setTocOpen(o => !o)} className={'mini-btn ' + (tocOpen ? 'on' : '')} aria-expanded={tocOpen}><IconList />本頁目錄 ({toc.length})</button>}
                <button onClick={copyLink} className="mini-btn"><IconLink size={14} />連結</button>
              </div>
            )}
            {tocOpen && (
              <div className="max-h-[45vh] overflow-y-auto border-b border-slate-200 bg-slate-50 px-2 py-2 flex-shrink-0 drawer-scroll">
                {toc.map(t => (
                  <button key={t.i} onClick={() => jumpToc(t.i)} className={'block w-full text-left text-sm px-3 py-2 rounded-md hover:bg-white ' + (t.nested ? 'pl-7 text-slate-500' : 'text-slate-700 font-medium')}>{t.text}</button>
                ))}
              </div>
            )}
            <div ref={scrollRef} className="flex-1 overflow-y-auto drawer-scroll overscroll-contain">
              {!panel ? <DrawerIndex onSelect={onSelect} />
                : !data ? (
                  <div className="p-6"><Notice tone="red">找不到參考面板「<code>{panel}</code>」。<button onClick={() => onSelect(null)} className="ml-1 underline font-semibold">瀏覽全部參考資料</button></Notice></div>
                ) : (
                  <div className="px-4 sm:px-6 py-5 pb-16">
                    {missingAnchor && <Notice>找不到小節「<code>{missingAnchor}</code>」，已顯示面板開頭。</Notice>}
                    {hits > 0 && <Notice tone="yellow">已標示 {hits} 處搜尋字詞。<button onClick={onClearHighlight} className="ml-1 underline font-semibold">清除標示</button></Notice>}
                    <div key={contentKey} ref={bodyRef} className="ref-content" onClick={onContentClick} dangerouslySetInnerHTML={{ __html: html }} />
                  </div>
                )}
            </div>
          </div>
        </div>
      );
    }

    const KIND_META = {
      question: { label: '決策問題', cls: 'bg-brand-50 text-brand-700 border-brand-100' },
      result: { label: '建議結果', cls: 'bg-blue-50 text-blue-700 border-blue-100' },
      note: { label: '註腳', cls: 'bg-slate-100 text-slate-600 border-slate-200' },
      ref: { label: '參考資料', cls: 'bg-emerald-50 text-emerald-700 border-emerald-100' }
    };
    // shown only when the term actually occurs in the loaded content
    const SEARCH_SAMPLES = ['ESD', 'CROSS', 'FLOT', 'nivolumab', 'pembrolizumab', 'HER2', 'PD-L1', 'CCRT', 'esophagectomy', 'Siewert', 'stent', 'proton', 'MSI', 'trastuzumab'];

    function SearchModal({ query, setQuery, onClose, onPickNode, onPickRef }) {
      const index = useMemo(() => getSearchIndex(), []);
      const [filter, setFilter] = useState('all');
      const [active, setActive] = useState(0);
      const [limit, setLimit] = useState(40);
      const terms = useMemo(() => splitTerms(query), [query]);
      const all = useMemo(() => runSearch(index, terms), [index, terms]);
      const counts = useMemo(() => ({ all: all.length, tree: all.filter(r => r.e.kind !== 'ref').length, ref: all.filter(r => r.e.kind === 'ref').length }), [all]);
      const results = useMemo(() => (filter === 'all' ? all : all.filter(r => (filter === 'ref' ? r.e.kind === 'ref' : r.e.kind !== 'ref'))), [all, filter]);
      const shown = results.slice(0, limit);
      const samples = useMemo(() => SEARCH_SAMPLES.filter(s => runSearch(index, splitTerms(s)).length > 0).slice(0, 8), [index]);
      const inputRef = useRef(null), listRef = useRef(null);

      useEffect(() => { if (inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, []);
      useEffect(() => { setActive(0); setLimit(40); }, [query, filter]);
      useEffect(() => {
        const el = listRef.current && listRef.current.querySelector('[data-active="1"]');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }, [active]);

      const pick = (r) => {
        const e = r.e;
        if (e.kind === 'ref') onPickRef(e.panel, e.anchor, e.headingIndex, terms);
        else if (e.kind === 'note') { if (e.users && e.users.length) onPickNode(e.users[0]); }
        else onPickNode(e.id);
      };
      const onKey = (ev) => {
        if (ev.key === 'ArrowDown') { ev.preventDefault(); setActive(a => Math.min(a + 1, shown.length - 1)); }
        else if (ev.key === 'ArrowUp') { ev.preventDefault(); setActive(a => Math.max(a - 1, 0)); }
        else if (ev.key === 'Enter') { const r = shown[active]; if (r) { ev.preventDefault(); pick(r); } }
      };
      const chip = (k, label) => (
        <button key={k} onClick={() => setFilter(k)} className={'px-3 py-1.5 rounded-full text-xs font-semibold border transition ' + (filter === k ? 'bg-brand-700 text-white border-brand-700' : 'bg-white text-slate-600 border-slate-200 hover:border-brand-500')}>
          {label} <span className="opacity-70">{counts[k]}</span>
        </button>
      );

      return (
        <div className="fixed inset-0 z-50 flex justify-center items-start sm:pt-[8vh]" role="dialog" aria-modal="true" aria-label="全文搜尋">
          <div className="absolute inset-0 bg-brand-900/50 backdrop-blur-sm lcg-fade" onClick={onClose} />
          <div className="relative w-full sm:max-w-2xl h-full sm:h-auto sm:max-h-[80vh] bg-white sm:rounded-2xl shadow-2xl flex flex-col animate-fade-in overflow-hidden">
            <div className="flex items-center gap-2 px-3 sm:px-4 border-b border-slate-200 safe-top">
              <span className="text-slate-400 pl-1"><IconSearch /></span>
              <input ref={inputRef} type="search" value={query} onChange={e => setQuery(e.target.value)} onKeyDown={onKey}
                placeholder="搜尋決策節點、註腳、參考資料…（多個關鍵字以空白分隔）" aria-label="搜尋關鍵字"
                className="flex-1 min-w-0 h-14 text-base outline-none bg-transparent placeholder:text-slate-400" />
              {query && <button onClick={() => { setQuery(''); if (inputRef.current) inputRef.current.focus(); }} className="text-xs font-semibold text-slate-400 hover:text-slate-600 px-2 py-1 flex-shrink-0">清除</button>}
              <button onClick={onClose} className="p-2 rounded-full hover:bg-slate-100 text-slate-500" aria-label="關閉搜尋"><IconX /></button>
            </div>
            {terms.length > 0 && (
              <div className="flex items-center gap-1.5 px-3 sm:px-4 py-2 border-b border-slate-100 overflow-x-auto no-scrollbar">
                {chip('all', '全部')}{chip('tree', '決策樹')}{chip('ref', '參考資料')}
              </div>
            )}
            <div ref={listRef} className="flex-1 overflow-y-auto drawer-scroll">
              {!terms.length && (
                <div className="p-5 text-sm text-slate-500 space-y-3">
                  <p>輸入關鍵字搜尋所有決策節點、建議內容、標籤、註腳與參考面板。不分大小寫；多個關鍵字以空白分隔（需同時符合）。</p>
                  {samples.length > 0 && (
                    <div className="flex flex-wrap gap-1.5">
                      {samples.map(s => <button key={s} onClick={() => setQuery(s)} className="px-3 py-1.5 rounded-full bg-slate-100 hover:bg-brand-50 hover:text-brand-700 text-slate-600 text-xs font-semibold">{s}</button>)}
                    </div>
                  )}
                  <p className="text-xs text-slate-400 hidden sm:block">↑↓ 選擇 · Enter 開啟 · Esc 關閉</p>
                </div>
              )}
              {terms.length > 0 && !results.length && <p className="p-6 text-center text-sm text-slate-500">找不到符合「{query}」的內容。</p>}
              {shown.map((r, i) => {
                const e = r.e; const km = KIND_META[e.kind];
                return (
                  <div key={e.kind + ':' + (e.id || e.panel) + ':' + i} data-active={i === active ? '1' : '0'} role="button" tabIndex={-1}
                    onMouseEnter={() => setActive(i)} onClick={() => pick(r)}
                    className={'px-4 py-3 border-b border-slate-100 cursor-pointer transition-colors ' + (i === active ? 'bg-sky-50' : 'hover:bg-slate-50')}>
                    <div className="flex items-center gap-2 mb-1 min-w-0">
                      <span className={'text-[11px] font-semibold px-2 py-0.5 rounded-full border flex-shrink-0 ' + km.cls}>{e.kind === 'ref' ? e.panelLabel : km.label}</span>
                      {e.kind === 'result' && e.sub && <span className="text-[11px] text-slate-400 truncate">{e.sub}</span>}
                      {e.kind === 'ref' && <span className="text-[11px] text-slate-400 truncate">{e.panelTitle}</span>}
                    </div>
                    {e.kind !== 'note' && <div className="font-semibold text-slate-800 text-[15px] leading-snug"><Hl text={e.title} terms={terms} /></div>}
                    <div className="text-sm text-slate-500 mt-0.5 leading-relaxed break-words"><Hl text={makeSnippet(e.text, terms)} terms={terms} /></div>
                    {e.kind === 'note' && (
                      <div className="mt-1.5 flex flex-wrap gap-1 items-center text-[11px] text-slate-400">
                        {e.users && e.users.length ? <span>出現於：</span> : <span>（未被任何節點引用）</span>}
                        {(e.users || []).slice(0, 4).map(u => (
                          <button key={u} onClick={(ev) => { ev.stopPropagation(); onPickNode(u); }} className="px-2 py-0.5 rounded-full bg-white border border-slate-200 hover:border-accent-500 text-slate-600">{truncate(defaultLabel(u), 24)}</button>
                        ))}
                        {e.users && e.users.length > 4 && <span>等 {e.users.length} 處</span>}
                      </div>
                    )}
                  </div>
                );
              })}
              {results.length > shown.length && (
                <button onClick={() => setLimit(l => l + 60)} className="w-full py-3 text-sm font-semibold text-accent-600 hover:bg-slate-50">顯示更多（尚有 {results.length - shown.length} 筆）</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function PageModal({ pages, start, onClose }) {
      const list = pages || [];
      const [cur, setCur] = useState(start || list[0] || 1);
      const [baseIdx, setBaseIdx] = useState(0);
      const [failed, setFailed] = useState(false);
      const [loaded, setLoaded] = useState(false);
      const [zoom, setZoom] = useState(1);
      const touch = useRef(null), scroller = useRef(null);
      const go = (p) => setCur(Math.min(TOTAL_PAGES, Math.max(1, p)));

      useEffect(() => { setBaseIdx(0); setFailed(false); setLoaded(false); if (scroller.current) scroller.current.scrollTop = 0; }, [cur]);
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'ArrowLeft') { e.preventDefault(); setCur(c => Math.max(1, c - 1)); }
          else if (e.key === 'ArrowRight') { e.preventDefault(); setCur(c => Math.min(TOTAL_PAGES, c + 1)); }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      useEffect(() => {
        if (!loaded) return;
        [cur - 1, cur + 1].filter(p => p >= 1 && p <= TOTAL_PAGES).forEach(p => { const im = new Image(); im.src = pageSrc(p, baseIdx); });
      }, [loaded, cur]);

      const src = pageSrc(cur, baseIdx);
      const onImgError = () => { if (baseIdx + 1 < CFG.pageBases.length) setBaseIdx(baseIdx + 1); else setFailed(true); };
      const imgStyle = zoom === 1 ? { width: '100%', maxWidth: '900px' } : { width: (zoom * 100) + '%', maxWidth: (900 * zoom) + 'px' };
      const btn = 'p-2 rounded-full hover:bg-white/10 disabled:opacity-30 flex-shrink-0';

      return (
        <div className="fixed inset-0 z-[60] bg-slate-900 flex flex-col lcg-fade" role="dialog" aria-modal="true" aria-label="原始頁面">
          <div className="flex items-center gap-1 px-3 h-14 text-white border-b border-white/10 safe-top flex-shrink-0">
            <span className="text-sky-300 mr-1"><IconFile size={18} /></span>
            <div className="font-semibold whitespace-nowrap">p.{cur}<span className="text-white/50 text-sm font-normal"> / {TOTAL_PAGES}</span></div>
            <div className="ml-auto flex items-center gap-0.5">
              <button className={btn} onClick={() => setZoom(z => Math.max(1, z - 0.5))} disabled={zoom <= 1} aria-label="縮小" title="縮小"><IconZoomOut /></button>
              <span className="text-xs text-white/60 w-10 text-center">{Math.round(zoom * 100)}%</span>
              <button className={btn} onClick={() => setZoom(z => Math.min(3, z + 0.5))} disabled={zoom >= 3} aria-label="放大" title="放大"><IconZoomIn /></button>
              <a className={btn} href={src} target="_blank" rel="noopener" aria-label="在新分頁開啟" title="在新分頁開啟"><IconExternal /></a>
              <button className={btn} onClick={onClose} aria-label="關閉" title="關閉 (Esc)"><IconX /></button>
            </div>
          </div>
          {list.length > 1 && (
            <div className="flex items-center gap-1.5 px-3 py-2 overflow-x-auto no-scrollbar border-b border-white/10 flex-shrink-0">
              <span className="text-[11px] text-white/50 flex-shrink-0 mr-1">相關頁面</span>
              {list.map(p => (
                <button key={p} onClick={() => go(p)} className={'px-2.5 py-1 rounded-full text-xs font-semibold flex-shrink-0 border ' + (p === cur ? 'bg-white text-slate-900 border-white' : 'text-white/80 border-white/20 hover:border-white/60')}>p.{p}</button>
              ))}
            </div>
          )}
          <div ref={scroller} className="flex-1 overflow-auto"
            onTouchStart={e => { if (zoom === 1 && e.touches.length === 1) touch.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }}
            onTouchEnd={e => {
              const s = touch.current; touch.current = null; if (!s) return;
              const t = e.changedTouches[0]; const dx = t.clientX - s.x, dy = t.clientY - s.y;
              if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
            }}>
            <div className="min-h-full flex items-start justify-center p-2 sm:p-4">
              {!failed ? (
                <>
                  {!loaded && <div className="absolute left-1/2 top-1/2 -translate-x-1/2 text-white/60 text-sm">載入中…</div>}
                  <img key={cur + ':' + baseIdx} src={src} alt={'原始指引第 ' + cur + ' 頁'} onLoad={() => setLoaded(true)} onError={onImgError}
                    className="block bg-white shadow-xl rounded-sm select-none" style={Object.assign({}, imgStyle, { opacity: loaded ? 1 : 0, transition: 'opacity .15s' })} draggable="false" />
                </>
              ) : (
                <div className="max-w-md mx-auto mt-10 text-center text-white/80 px-4" role="alert">
                  <div className="mx-auto w-12 h-12 rounded-full bg-white/10 flex items-center justify-center mb-3 text-amber-300"><IconAlert /></div>
                  <p className="font-semibold">無法載入原始頁面圖片（p.{cur}）</p>
                  <p className="mt-2 text-sm text-white/60">請確認 <code className="text-sky-200">_source_pages/</code> 資料夾與本頁面位於同一目錄（單檔版本需另外複製此資料夾）。</p>
                  <p className="mt-2 text-xs text-white/40 break-all">嘗試路徑：{CFG.pageBases.map(b => b + 'p' + pad2(cur) + '.png').join('、')}</p>
                </div>
              )}
            </div>
          </div>
          <div className="flex items-center justify-between gap-3 px-3 pt-3 border-t border-white/10 safe-bottom flex-shrink-0">
            <button onClick={() => go(cur - 1)} disabled={cur <= 1} className="flex items-center gap-1 px-4 min-h-[44px] rounded-full bg-white/10 hover:bg-white/20 text-white text-sm font-semibold disabled:opacity-30"><IconChevronLeft size={18} />上一頁</button>
            <span className="text-white/40 text-[11px] text-center hidden sm:block">← → 翻頁 · Esc 關閉</span>
            <span className="text-white/40 text-[11px] text-center sm:hidden">左右滑動翻頁</span>
            <button onClick={() => go(cur + 1)} disabled={cur >= TOTAL_PAGES} className="flex items-center gap-1 px-4 min-h-[44px] rounded-full bg-white/10 hover:bg-white/20 text-white text-sm font-semibold disabled:opacity-30">下一頁<IconChevronRight size={18} /></button>
          </div>
        </div>
      );
    }

    /* =====================================================================
     * 11. APP (routing + overlay orchestration)
     * ===================================================================== */
    function App() {
      const [hash, setHash] = useState(() => window.location.hash || '');
      const route = useMemo(() => parseHash(hash), [hash]);
      const isRef = route.kind === 'ref';
      const [baseHash, setBaseHash] = useState(() => (parseHash(window.location.hash).kind === 'ref' ? '' : (window.location.hash || '')));
      const view = useMemo(() => (isRef ? parseHash(baseHash) : route), [isRef, baseHash, route]);
      const refPushedRef = useRef(false);   // true when the current #/ref entry was pushed on top of baseHash by us
      const expectPushRef = useRef(false);
      const [drawerOpts, setDrawerOpts] = useState({ nonce: 0 });
      const [wide, setWide] = useState(false);
      const [searchOpen, setSearchOpen] = useState(false);
      const [query, setQuery] = useState('');
      const [pageModal, setPageModal] = useState(null);
      const [toast, setToast] = useState(null);
      const [errorsHidden, setErrorsHidden] = useState(false);
      const toastTimer = useRef(null);

      useEffect(() => { window.__ECG_BOOTED = true; const b = document.getElementById('boot-msg'); if (b) b.remove(); }, []);

      useEffect(() => {
        const onHash = () => {
          const h = window.location.hash || '';
          refPushedRef.current = parseHash(h).kind === 'ref' ? expectPushRef.current : false;
          expectPushRef.current = false;
          setHash(h);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      useEffect(() => { if (!isRef) setBaseHash(hash); }, [hash, isRef]);

      const navigate = useCallback((h, opts) => {
        opts = opts || {};
        if (!h || h === '#') h = '#/';
        if (h[0] !== '#') h = '#' + h;
        if (parseHash(h).kind !== 'ref') refPushedRef.current = false;
        if (opts.replace) {
          try { window.history.replaceState(null, '', h); } catch (e) { window.location.replace(h); return; }
          setHash(h);
          return;
        }
        if ((window.location.hash || '') === h) { setHash(h); return; }
        window.location.hash = h;
      }, []);

      const openRef = useCallback((panel, anchor, extra) => {
        setDrawerOpts(Object.assign({ nonce: Date.now() + Math.random() }, extra || {}));
        const h = refHash(panel, anchor);
        if (parseHash(window.location.hash).kind === 'ref') navigate(h, { replace: true });
        else { expectPushRef.current = true; navigate(h); }
      }, [navigate]);
      const closeDrawer = useCallback(() => {
        if (refPushedRef.current) { refPushedRef.current = false; window.history.back(); }
        else navigate(baseHash || '#/', { replace: true });
      }, [navigate, baseHash]);
      const onInternalLink = useCallback((href) => {
        const r = parseHash(href);
        if (r.kind === 'ref') openRef(r.panel, r.anchor);
        else navigate(href, { replace: true });
      }, [openRef, navigate]);

      const showToast = useCallback((msg) => {
        setToast(msg); clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 1800);
      }, []);
      const copyLink = useCallback(() => {
        copyText(window.location.href).then(ok => showToast(ok ? '已複製連結' : '無法自動複製，請手動複製網址列'));
      }, [showToast]);
      const openPages = useCallback((pages, startPage) => {
        if (!HAS_PAGES) return;   // META.sourcePages = 0: no source viewer in this app
        const ps = normPages(pages).filter(n => n <= TOTAL_PAGES);
        setPageModal({ pages: ps, start: startPage || ps[0] || 1, key: Date.now() });
      }, []);
      const goNode = useCallback((id) => {
        const p = pathFromRoot(id);
        navigate(p ? treeHash('path', p) : treeHash('node', [id], 'stage'));
      }, [navigate]);

      // scroll to top when the main view changes (not when only an overlay opens/closes)
      const viewKey = view.kind === 'tree' ? view.mode + ':' + view.ids.join('/') : view.kind;
      useEffect(() => { window.scrollTo(0, 0); }, [viewKey]);

      const anyOverlay = isRef || searchOpen || !!pageModal;
      useEffect(() => { document.body.style.overflow = anyOverlay ? 'hidden' : ''; }, [anyOverlay]);

      useEffect(() => {
        const onKey = (e) => {
          const t = e.target || {};
          const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName || '') || t.isContentEditable;
          if (e.key === 'Escape') {
            if (pageModal) setPageModal(null);
            else if (searchOpen) setSearchOpen(false);
            else if (isRef) closeDrawer();
            return;
          }
          if (!typing && !pageModal && (e.key === '/' || ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')))) {
            e.preventDefault(); setSearchOpen(true);
          }
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [pageModal, searchOpen, isRef, closeDrawer]);

      const loadErrors = useMemo(() => {
        const errs = LOAD_ERRORS.slice();
        if (!DATA_OK) errs.unshift({ file: 'data/00_core.js', message: 'window.ECG 未建立（核心資料檔未載入或發生錯誤）' });
        return errs;
      }, []);

      const crumbs = useMemo(() => {
        if (view.kind !== 'tree') return [];
        const { mode, ids, from } = view;
        const out = [];
        if (mode === 'node') {
          const isStage = from === 'stage';
          out.push({ label: isStage ? '分期計算器' : '搜尋', special: true, icon: isStage ? <IconCalc size={13} /> : <IconSearch size={13} />,
            onClick: isStage ? () => navigate('#/stage') : () => setSearchOpen(true) });
        }
        ids.forEach((id, i) => {
          const label = i === 0 ? defaultLabel(id) : labelFor(ids[i - 1], id);
          out.push({ label, current: i === ids.length - 1, missing: !TREE[id], onClick: () => navigate(treeHash(mode, ids.slice(0, i + 1), from)) });
        });
        return out;
      }, [view, navigate]);

      let main;
      if (view.kind === 'tree') main = <TreeView route={view} navigate={navigate} openRef={openRef} openPages={openPages} openSearch={() => setSearchOpen(true)} copyLink={copyLink} />;
      else if (view.kind === 'stage') main = <StageView route={view} navigate={navigate} goNode={goNode} openRef={openRef} openPages={openPages} />;
      else main = <HomeView navigate={navigate} openSearch={() => setSearchOpen(true)} openRef={(k) => openRef(k)} openPages={openPages} />;

      return (
        <div className="min-h-screen flex flex-col">
          <Header onHome={() => navigate('#/')} onSearch={() => setSearchOpen(true)} onStage={() => navigate('#/stage')} onRefs={() => openRef(null)} />
          {view.kind === 'tree' && <Breadcrumb crumbs={crumbs} />}
          <main className={'flex-1 w-full mx-auto px-4 py-5 sm:py-6 ' + (view.kind === 'home' ? 'max-w-3xl' : 'max-w-2xl')}>
            {!errorsHidden && <DataErrorBanner errors={loadErrors} onDismiss={() => setErrorsHidden(true)} />}
            <ErrorBoundary key={view.kind === 'stage' ? 'stage' : viewKey} onHome={() => navigate('#/')}>{main}</ErrorBoundary>
          </main>
          <Footer />

          {!isRef && (
            <button onClick={() => openRef(null)} title="參考資料" aria-label="參考資料"
              className="fab no-print fixed z-30 right-4 sm:right-6 w-14 h-14 sm:w-16 sm:h-16 bg-brand-700 text-white rounded-full shadow-lg hover:bg-brand-900 hover:scale-105 transition-all flex items-center justify-center"
              style={{ bottom: 'max(1rem, env(safe-area-inset-bottom))' }}>
              <IconBook size={24} />
            </button>
          )}
          {isRef && (
            <Drawer panel={route.panel} anchor={route.anchor} opts={drawerOpts} wide={wide} onToggleWide={() => setWide(w => !w)}
              onClose={closeDrawer} onSelect={(k) => openRef(k)} openPages={openPages} onInternalLink={onInternalLink}
              onClearHighlight={() => openRef(route.panel, route.anchor)} copyLink={copyLink} />
          )}
          {searchOpen && (
            <SearchModal query={query} setQuery={setQuery} onClose={() => setSearchOpen(false)}
              onPickNode={(id) => { setSearchOpen(false); navigate(treeHash('node', [id])); }}
              onPickRef={(panel, anchor, headingIndex, terms) => { setSearchOpen(false); openRef(panel, anchor, { headingIndex, terms }); }} />
          )}
          {HAS_PAGES && pageModal && <PageModal key={pageModal.key} pages={pageModal.pages} start={pageModal.start} onClose={() => setPageModal(null)} />}
          {toast && <div role="status" className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[70] bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-lg lcg-fade">{toast}</div>}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Fallback if React/Babel (CDN) never boot: show a readable error instead of a blank page.
       Head scripts are blocking, so when this runs a missing React/Babel means the CDN failed. -->
  <script>
    (function () {
      var t0 = Date.now(), shown = false;
      function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function show(reason) {
        var el = document.getElementById('root'); if (!el || shown) return; shown = true;
        var errs = (window.__ECG_UI_ERRORS || []).concat(window.__ECG_ERRORS || []);
        el.innerHTML = '<div style="max-width:560px;margin:48px 16px;padding:20px;font-family:system-ui,sans-serif;color:#7f1d1d;background:#fef2f2;border:1px solid #fecaca;border-radius:12px">' +
          '<h2 style="margin:0 0 8px;font-size:18px">無法啟動指引系統</h2>' +
          '<p style="margin:0 0 8px;font-size:14px;color:#991b1b">' + esc(reason) + '</p>' +
          (errs.length ? '<ul style="font-size:13px;padding-left:18px;margin:8px 0">' + errs.map(function (e) { return '<li><code>' + esc(e.file) + '</code>：' + esc(e.message) + '</li>'; }).join('') + '</ul>' : '') +
          '<p style="margin:8px 0 0;font-size:12px;color:#b91c1c">請確認網路連線（React / Babel / Tailwind 由 CDN 載入）後重新整理頁面。</p></div>';
      }
      function check() {
        if (window.__ECG_BOOTED) return;
        var missing = [];
        if (typeof React === 'undefined') missing.push('React');
        if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
        if (typeof Babel === 'undefined') missing.push('Babel');
        if (missing.length) return show('無法載入程式庫：' + missing.join(', ') + '。');
        var uiRuntime = (window.__ECG_UI_ERRORS || []).filter(function (e) { return e.kind === 'runtime'; });
        if (uiRuntime.length && Date.now() - t0 > 1500) return show('介面程式發生錯誤。');
        if (Date.now() - t0 > 60000) return show('載入逾時。');
        setTimeout(check, 500);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(check, 300); });
      else setTimeout(check, 300);
    })();
  </script>
</body>
</html>
